name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run LeetCode Sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python -c '
          import os, requests
          
          session = os.environ["LEETCODE_SESSION"]
          repo_name = os.environ["REPO_NAME"]
          token = os.environ["GITHUB_TOKEN"]

          headers = {
              "Cookie": f"LEETCODE_SESSION={session}",
              "Referer": "https://leetcode.com"
          }

          query = """
          query recentAcSubmissions($limit: Int!) {
            recentAcSubmissionList(limit: $limit) {
              id
              title
              titleSlug
              timestamp
            }
          }
          """
          
          response = requests.post(
              "https://leetcode.com/graphql",
              json={"query": query, "variables": {"limit": 20}},
              headers=headers
          )
          
          data = response.json()
          submissions = data.get("data", {}).get("recentAcSubmissionList", [])
          print(f"Found {len(submissions)} submissions to sync.")
          
          os.system("git config --global user.name \"GitHub Action\"")
          os.system("git config --global user.email \"action@github.com\"")

          for sub in submissions:
              sub_id = sub["id"]
              title = sub["title"]
              slug = sub["titleSlug"]
              
              detail_query = """
              query submissionDetails($submissionId: Int!) {
                submissionDetails(submissionId: $submissionId) {
                  code
                  lang {
                    name
                  }
                }
              }
              """
              detail_res = requests.post(
                  "https://leetcode.com/graphql",
                  json={"query": detail_query, "variables": {"submissionId": int(sub_id)}},
                  headers=headers
              )
              detail_data = detail_res.json()
              details = detail_data.get("data", {}).get("submissionDetails")
              
              if not details:
                  continue
                  
              code = details["code"]
              lang_name = details["lang"]["name"]
              
              ext_map = {"python3": "py", "python": "py", "cpp": "cpp", "java": "java", "javascript": "js", "c": "c"}
              ext = ext_map.get(lang_name, "txt")
              
              file_path = f"solutions/{slug}.{ext}"
              os.makedirs("solutions", exist_ok=True)
              
              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(code)
              
          os.system("git add solutions/")
          os.system("git commit -m \"Sync latest LeetCode solutions [skip ci]\" || echo \"No changes to commit\"")
          os.system(f"git push https://x-access-token:{token}@github.com/{repo_name}.git HEAD:main")
          '
